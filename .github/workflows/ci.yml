name: CI

on:
  push:
    branches: ["feature/**", "fix/**"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon test 2>&1 | tee build.log
      - name: Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee -a build.log
      - name: Samenvatting van fouten
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Caused by" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line:0:400}"
          done
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      msg = (fl.get('message') or '')[:300].replace('\n', ' ')
                      trace = (fl.text or '')[:700].replace('\n', ' | ')
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg} || {trace}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
